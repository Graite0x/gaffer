[project]
name = "gaffer"
version = "0.1.0"
description = "A graph of loops: schedule a fleet, run each node as a bounded loop, take done back."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Graite0x" }]
keywords = ["agents", "orchestration", "worktree", "beads", "claude"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gaffer = "gaffer.cli:main"

[project.urls]
Homepage = "https://github.com/Graite0x/gaffer"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
